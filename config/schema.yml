# Sharesies NZ x Atlas — MoM Performance + Budgets
# Structural definition of the reporting doc. Edit here, not in the scripts.

client: Sharesies NZ
currency: NZD

# The doc's first month column. Columns run forward monthly from here.
start_month: "2024-09"

channels:
  - TikTok
  - YouTube
  - Meta
  - Reddit
  - Spotify
  - Stackadapt
  - Google
  - LinkedIn

# Conversion products, in the order the doc presents them.
# `label` is what the client-facing report shows.
products:
  - key: kiwisaver
    label: KiwiSaver
    doc_section: "KiwiSaver Conversions"
  - key: crypto
    label: Crypto
    doc_section: "Crypto Conversions"
  - key: spend_signup
    label: Spend
    doc_section: "Spend Conversions"
  - key: subscription
    label: Subscription (Plan Started)
    doc_section: "Subscription Conversions (Plan Started) $NZD"
  - key: insure_quote
    label: Insure (Quote)
    doc_section: "Insure Conversions (Quote) $NZD"
  - key: save
    label: Save
    doc_section: "Save Conversions $NZD"
  - key: insure_payment
    label: Insure (Payment)
    doc_section: "Insure Conversions (Payment) $NZD"

# Which channels each product actually runs on. Channels absent from a
# product's list are rendered blank rather than as a misleading 0.
product_channels:
  kiwisaver:      [TikTok, YouTube, Meta, Reddit, Google, Stackadapt]
  crypto:         [TikTok, YouTube, Meta, Reddit, Google, Stackadapt]
  spend_signup:   [TikTok, YouTube, Meta, Reddit, Google, Stackadapt]
  subscription:   [TikTok, YouTube, Meta, Reddit, Google, Stackadapt]
  insure_quote:   [TikTok, YouTube, Meta, Reddit, Google, Stackadapt]
  save:           [Meta, Reddit, Stackadapt, Google]
  insure_payment: [TikTok, YouTube, Meta, Reddit, Google, Stackadapt]

# How each channel's numbers get into the store each week.
#   auto   = pulled via an MCP connector by the /mom-update skill
#   manual = typed into manual_input/<month>.yml by a human
sourcing:
  Meta:       {mode: auto,   connector: meta_ads,   account: "1432660143475665"}
  Google:     {mode: auto,   connector: google_ads, account: "3844401760", channel_types: [SEARCH, SHOPPING, PERFORMANCE_MAX, DISPLAY, DEMAND_GEN]}
  YouTube:    {mode: auto,   connector: google_ads, account: "3844401760", channel_types: [VIDEO]}
  LinkedIn:   {mode: auto,   connector: linkedin,   account: null}
  TikTok:     {mode: manual, connector: null,       account: null}
  Reddit:     {mode: manual, connector: null,       account: null}
  Spotify:    {mode: manual, connector: null,       account: null}
  Stackadapt: {mode: manual, connector: null,       account: null}

# ---------------------------------------------------------------------------
# Platform -> product mapping.
#
# Verified 2026-08-18 against the doc's own August figures: every derived
# Meta ratio landed in 0.85-0.91 against a spend ratio of 0.867 (the doc was a
# mid-month snapshot), and Insure (Payment) matched exactly at 27. Google's
# rudderstack_* set matched crypto and insure_quote exactly.
#
# If Sharesies renames an event, change it HERE -- no script edits needed.
# ---------------------------------------------------------------------------
mapping:
  google_ads:
    # Conversion-action names on customer 3844401760. Three parallel tracking
    # stacks exist (rudderstack_*, "Sharesies - GA4 - MAIN (web) *", and bare
    # names). They must NEVER be summed -- that triple-counts. rudderstack_* is
    # the set the doc has always used.
    metric: all_conversions
    action_prefix: "rudderstack_"
    actions:
      kiwisaver:      rudderstack_kiwisaver_signup_completed
      crypto:         rudderstack_crypto_signup_completed
      spend_signup:   rudderstack_spend_signup_completed
      subscription:   rudderstack_subscription_plan_started
      insure_quote:   rudderstack_insurance_quote_created
      insure_payment: rudderstack_insurance_payment_completed
      save:           rudderstack_save_account_opened

  meta_ads:
    # The Meta MCP surface exposes no raw action counts, but it does expose
    # cost_per_conversion per named pixel event. conversions = spend / cpa.
    # build_pull.py asserts each result is within 0.02 of a whole number,
    # which is the guard that this division stayed sound.
    derive_from: cost_per_conversion
    actions:
      kiwisaver:      "offsite_conversion.fb_pixel_custom.kiwisaver_signup_completed"
      crypto:         "offsite_conversion.fb_pixel_custom.crypto_signup_completed"
      spend_signup:   "offsite_conversion.fb_pixel_custom.spend_signup_completed"
      subscription:   "offsite_conversion.fb_pixel_custom.subscription_plan_started"
      insure_quote:   "offsite_conversion.fb_pixel_custom.insurance_quote_created"
      insure_payment: "offsite_conversion.fb_pixel_custom.insurance_payment_complete"
      save:           "offsite_conversion.fb_pixel_custom.save_account_opened"
    # Duplicate near-identical events exist on the account. Not summed; noted
    # so nobody "fixes" the mapping by adding them together later.
    known_duplicates:
      save:      "offsite_conversion.fb_pixel_custom.save account open"
      kiwisaver: "offsite_conversion.fb_pixel_custom.kiwisaver account open"
